[package]
name = "voxel-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Voxel and chunk primitives for the voxulacrum world-generation engine."

[dependencies]
glam.workspace = true
serde = { workspace = true, optional = true }
ron = { workspace = true, optional = true }
thiserror.workspace = true
static_assertions.workspace = true

[features]
default = ["serde"]
serde = ["dep:serde", "glam/serde", "dep:ron"]

[dev-dependencies]
criterion.workspace = true
serde_json.workspace = true

[[bench]]
name = "chunk_iter"
harness = false