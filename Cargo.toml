[package]
name = "voxulacrum"
version = "0.1.1"
edition = "2021"

[dependencies]
wgpu = "25"
winit = "0.30"
glam = "0.29"
fastnoise-lite = "1"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
image = "0.25"
env_logger = "0.11"
log = "0.4"
egui = "0.32"
egui-wgpu = "0.32"
egui-winit = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
num_cpus = "1"
bincode = "1"
seahash = "4"
rayon = "1"
bevy_ecs = { version = "0.16", default-features = false }
lz4_flex = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
smallvec = "1.15.1"
fastnoise2 = "0.4"