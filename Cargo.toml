[package]
name = "voxulacrum"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "25"
winit = "0.30"
glam = "0.29"
fastnoise-lite = "1"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
image = "0.25"
env_logger = "0.11"
log = "0.4"
egui = "0.32"
egui-wgpu = "0.32"
egui-winit = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"