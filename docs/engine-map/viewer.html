<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voxulacrum Engine Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: five horizontal region bands, top to bottom in rough data-flow order, with a sticky detail panel on the right; stacks to one column below 960px. */
:root {
  --bg: #eceef0;
  --surface: #f9fafb;
  --surface-2: #e2e6ea;
  --ink: #1b2128;
  --muted: #59636f;
  --line: #c8ced5;
  --accent: #2b54c4;
  --accent-soft: rgba(43, 84, 196, 0.12);
  --oak: #a8743a;
  --moss: #5b8a3a;
  --limestone: #978d74;
  --slate: #5a6c96;
  --water: #2a8a97;
  --settled: #3d7b4c;
  --interim: #a97810;
  --active: #7a4fc4;
  --f-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b; --surface: #1c2025; --surface-2: #262b32; --ink: #e3e7ec; --muted: #9aa4af;
    --line: #353c45; --accent: #8aa6ff; --accent-soft: rgba(138, 166, 255, 0.16);
    --oak: #c99257; --moss: #7fae5a; --limestone: #b9ae94; --slate: #8399cb; --water: #4fb4c1;
    --settled: #6fbf82; --interim: #d9a843; --active: #b493f2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171b; --surface: #1c2025; --surface-2: #262b32; --ink: #e3e7ec; --muted: #9aa4af;
  --line: #353c45; --accent: #8aa6ff; --accent-soft: rgba(138, 166, 255, 0.16);
  --oak: #c99257; --moss: #7fae5a; --limestone: #b9ae94; --slate: #8399cb; --water: #4fb4c1;
  --settled: #6fbf82; --interim: #d9a843; --active: #b493f2;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 14px; line-height: 1.5;
  padding-inline: 20px; padding-block: 0 40px;
}
code, .mono { font-family: var(--f-mono); font-size: 0.86em; }
code { background: var(--surface-2); padding: 0.05em 0.35em; border-radius: 3px; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Header ---------- */
.top {
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px;
  padding-block: 22px 16px; border-bottom: 1px solid var(--line); margin-bottom: 18px;
}
.brand h1 {
  font-family: var(--f-display); font-weight: 600; font-size: 26px; letter-spacing: 0.01em;
  margin: 0; line-height: 1.1; text-wrap: balance;
}
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
.brand p .mono { color: var(--ink); }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; }
.ctl { display: flex; flex-direction: column; gap: 4px; border: 0; margin: 0; padding: 0; min-width: 0; }
.ctl legend, .ctl .lbl {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); padding: 0; margin-bottom: 4px;
}
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; background: var(--surface); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label {
  padding: 5px 11px; cursor: pointer; font-size: 13px; border-right: 1px solid var(--line); white-space: nowrap;
}
.seg label:last-of-type { border-right: 0; }
.seg input:checked + label { background: var(--ink); color: var(--bg); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }
.notes-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 5px 11px; cursor: pointer; font-size: 13px;
}
.notes-btn b { font-family: var(--f-mono); font-weight: 500; color: var(--interim); }
.notes-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.notes-btn[aria-pressed="true"] b { color: inherit; }

/* ---------- Layout ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px; align-items: start; }
@media (max-width: 959px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* ---------- Map ---------- */
.map { position: relative; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 2; }
.edges path.e { fill: none; stroke-width: 1.6; }
.edges path.e.out { stroke: var(--accent); }
.edges path.e.in { stroke: var(--muted); stroke-dasharray: 5 4; }
.edges path.e.hot { stroke-width: 3.2; }
.edges path.e.lens { stroke: var(--accent); stroke-width: 2.4; }
.edges marker path { stroke: none; }
.edges .m-out path { fill: var(--accent); }
.edges .m-in path { fill: var(--muted); }

.band {
  display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px;
}
@media (max-width: 700px) { .band { grid-template-columns: minmax(0, 1fr); } }
.band-head {
  display: flex; flex-direction: column; gap: 6px; text-align: left; background: none; border: 0; padding: 4px 2px; cursor: pointer; border-radius: 4px;
}
.band-head:hover .rname { text-decoration: underline; text-underline-offset: 3px; }
.band-head.sel { background: var(--accent-soft); }
.rtitle { display: flex; align-items: center; gap: 8px; }
.rname { font-family: var(--f-display); font-weight: 600; font-size: 16px; line-height: 1.15; }
.rmat { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); letter-spacing: 0.04em; }
.rblurb { color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.rstats { font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.z-regions .rblurb { display: block; }

.cube { width: 22px; height: 22px; flex: none; }
.cube .t { fill: color-mix(in oklab, var(--m) 52%, white); }
.cube .l { fill: var(--m); }
.cube .r { fill: color-mix(in oklab, var(--m) 62%, black); }

.cards { display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; min-width: 0; }
.card {
  position: relative; z-index: 3;
  flex: 1 1 224px; max-width: 100%; min-width: 0;
  display: flex; flex-direction: column;
  background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
  transition: opacity 120ms ease, border-color 120ms ease;
}
.z-modules .card { flex-basis: 290px; }
.z-regions .card { flex: 0 1 auto; }
.card-main {
  display: flex; flex-direction: column; gap: 4px; text-align: left; background: none; border: 0; padding: 9px 11px 8px; cursor: pointer; min-width: 0;
}
.card-title { display: flex; align-items: center; gap: 7px; min-width: 0; }
.nm { font-weight: 600; font-size: 14px; line-height: 1.25; }
.card-main:hover .nm { text-decoration: underline; text-underline-offset: 3px; }
.crate { font-family: var(--f-mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.sum { font-size: 12.5px; color: var(--muted); line-height: 1.42; }
.loc { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
.bar { flex: 1; height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--m); }
.num { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.steps { margin-left: auto; display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; }
.steps span {
  font-family: var(--f-mono); font-size: 10.5px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px;
  display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--accent); color: var(--accent); background: var(--bg);
}
.steps span.now { background: var(--accent); color: var(--bg); }

.mods-toggle {
  border: 0; border-top: 1px dashed var(--line); background: none; text-align: left; padding: 5px 11px; cursor: pointer;
  font-size: 11.5px; color: var(--muted);
}
.mods-toggle:hover { color: var(--ink); }
.mods { list-style: none; margin: 0; padding: 2px 6px 8px; display: none; border-top: 1px dashed var(--line); }
.card.open .mods, .z-modules .mods { display: block; }
.z-modules .mods-toggle { display: none; }
.mods button {
  display: flex; width: 100%; justify-content: space-between; gap: 10px; align-items: baseline;
  background: none; border: 0; padding: 3px 5px; cursor: pointer; border-radius: 3px; text-align: left;
}
.mods button:hover { background: var(--surface-2); }
.mods button.sel { background: var(--accent-soft); }
.mn { font-family: var(--f-mono); font-size: 11.5px; overflow-wrap: anywhere; min-width: 0; }
.ml { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }

.z-regions .crate, .z-regions .sum, .z-regions .loc, .z-regions .mods, .z-regions .mods-toggle { display: none !important; }
.z-regions .card-main { padding: 6px 10px; }

.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card.linked { border-color: var(--accent); }
.card.now { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.map.focus .card:not(.sel):not(.linked):not(.now):not(.inlens) { opacity: 0.42; }
.map.lensing .card:not(.inlens) { opacity: 0.42; }

/* status glyph: shape + color */
.st { width: 10px; height: 10px; flex: none; display: inline-block; border-radius: 1px; }
.st-settled { background: var(--settled); }
.st-interim { border: 1.5px dashed var(--interim); }
.st-active { border: 1.5px solid var(--active); background: linear-gradient(135deg, var(--active) 50%, transparent 50%); }

/* ---------- Panel ---------- */
.panel {
  position: sticky; top: calc(14px + env(safe-area-inset-top, 0px));
  max-height: calc(100vh - 28px); overflow: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px 18px 22px; min-width: 0;
}
@media (max-width: 959px) { .panel { position: static; max-height: none; } }
.panel h2 { font-family: var(--f-display); font-weight: 600; font-size: 21px; line-height: 1.15; margin: 2px 0 6px; text-wrap: balance; }
.panel h3 {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; margin: 18px 0 6px;
}
.panel p { margin: 0 0 8px; }
.panel ul { margin: 0; padding-left: 18px; }
.panel li { margin-bottom: 5px; }
.eyebrow { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; padding: 2px 8px 2px 6px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); white-space: nowrap;
}
.status-note { font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--interim); padding: 2px 0 2px 10px; margin: 8px 0 0; }
.summary { font-size: 14px; }
.kv { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 4px 10px; font-size: 13px; }
.kv dt { color: var(--muted); font-size: 12px; }
.kv dd { margin: 0; }
.links { list-style: none; padding: 0 !important; display: flex; flex-direction: column; gap: 3px; }
.links li { margin: 0 !important; }
.lnk {
  display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 2px 8px; width: 100%; text-align: left;
  background: none; border: 0; padding: 5px 6px; border-radius: 4px; cursor: pointer;
}
.lnk:hover, .lnk:focus-visible { background: var(--surface-2); }
.lnk .arr { font-family: var(--f-mono); color: var(--accent); }
.lnk .arr.in { color: var(--muted); }
.lnk .who { font-weight: 600; font-size: 13px; }
.lnk .what { grid-column: 2; font-size: 12.5px; color: var(--muted); }
.paths { list-style: none; padding: 0 !important; }
.paths li { font-family: var(--f-mono); font-size: 11.5px; overflow-wrap: anywhere; display: flex; justify-content: space-between; gap: 10px; margin-bottom: 2px !important; }
.paths li span:last-child { color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
.textbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-size: 13px; }
.backbar { margin: -4px 0 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.chip { font-size: 11.5px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--ink); white-space: nowrap; }
.chip.main { background: var(--ink); color: var(--bg); }
.chip.stage { border-color: var(--line); color: var(--muted); font-family: var(--f-mono); font-size: 11px; }

.stepper { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 0 10px; }
.stepper button {
  border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 4px 11px; cursor: pointer; font-size: 13px;
}
.stepper button:disabled { opacity: 0.4; cursor: default; }
.stepper .pos { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stepbox { border: 1px solid var(--accent); border-radius: 5px; padding: 12px 13px; background: var(--bg); }
.stepbox h4 { margin: 0 0 2px; font-size: 15.5px; }
.steplist { list-style: none; padding: 0 !important; margin-top: 4px !important; counter-reset: s; }
.steplist li { margin: 0 !important; }
.steplist button {
  display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; width: 100%; text-align: left; align-items: baseline;
  background: none; border: 0; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 13px;
}
.steplist button:hover { background: var(--surface-2); }
.steplist button.cur { background: var(--accent-soft); }
.steplist .n { font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.steplist .w { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.legend { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 10px; align-items: center; font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 4px 0 4px; }
.stat { border: 1px solid var(--line); border-radius: 4px; padding: 8px 9px; background: var(--bg); }
.stat b { display: block; font-family: var(--f-display); font-weight: 600; font-size: 19px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 11.5px; color: var(--muted); }
.note { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.note:first-of-type { border-top: 0; margin-top: 4px; padding-top: 0; }
.note h4 { margin: 0 0 4px; font-size: 14px; }
.foot { font-size: 12px; color: var(--muted); margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

/* where-to-look list: file and symbol on their own lines, wrapping inside the panel */
.where { list-style: none; padding: 0 !important; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.where li { margin: 0 !important; min-width: 0; overflow-wrap: anywhere; font-family: var(--f-mono); line-height: 1.35; }
.where .wf { display: block; font-size: 11px; color: var(--muted); }
.where .ws { display: block; font-size: 12px; }
.where .miss { display: inline-block; margin-top: 2px; font-family: var(--f-body); font-size: 11px; color: var(--interim); }
.paths li > :first-child { min-width: 0; overflow-wrap: anywhere; text-align: left; }
.chip.stage { white-space: normal; overflow-wrap: anywhere; }
.warn { font-family: var(--f-mono); font-size: 10.5px; color: var(--interim); border: 1px dashed var(--interim); border-radius: 3px; padding: 0 4px; }
.health h4 { margin: 14px 0 6px; font-size: 13px; }
.health li { font-size: 13px; }
.src-tag { font-size: 11px; color: var(--muted); }
.coupling { font-size: 13px; }
.coupling .no { color: var(--interim); font-size: 12px; }
.empty-data { padding: 40px 0; color: var(--muted); }
</style>

<header class="top">
  <div class="brand">
    <h1>Voxulacrum Engine Map</h1>
    <p id="meta-line"></p>
  </div>
  <div class="controls">
    <fieldset class="ctl">
      <legend>Zoom</legend>
      <div class="seg" role="radiogroup">
        <input type="radio" name="zoom" id="z-regions" value="regions"><label for="z-regions">Regions</label>
        <input type="radio" name="zoom" id="z-subsystems" value="subsystems" checked><label for="z-subsystems">Subsystems</label>
        <input type="radio" name="zoom" id="z-modules" value="modules"><label for="z-modules">Modules</label>
      </div>
    </fieldset>
    <fieldset class="ctl">
      <legend>Lens</legend>
      <div class="seg" role="radiogroup" id="lens-seg"></div>
    </fieldset>
    <div class="ctl">
      <span class="lbl">Drift</span>
      <button class="notes-btn" id="notes-btn" aria-pressed="false">Drift and checks <b id="notes-count"></b></button>
    </div>
  </div>
</header>

<div class="layout">
  <main class="map z-subsystems" id="map" aria-label="Engine map"></main>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

<!-- extract.py replaces the marker below with the merged map data. -->
<script id="map-data" type="application/json">/*MAP_DATA*/</script>

<script>
let DATA;
try { DATA = JSON.parse(document.getElementById("map-data").textContent); }
catch (e) {
  document.getElementById("map").innerHTML = `<p class="empty-data">This is the template. Run <code>python docs/engine-map/extract.py</code> and open <code>engine-map.html</code>.</p>`;
  throw e;
}
const { meta: META, regions: REGIONS, subs: SUBS, edges: EDGES, lenses: LENSES, notes: NOTES, couplings: COUPLINGS, health: HEALTH } = DATA;

const subById = Object.fromEntries(SUBS.map(s => [s.id, s]));
const regById = Object.fromEntries(REGIONS.map(r => [r.id, r]));

/* Module display names: drop "crates/" and "/src/", then any directory shared by every module of the subsystem. */
for (const s of SUBS) {
  const shorts = s.modules.map(m => m.p.replace(/^crates\//, "").replace("/src/", "/"));
  let common = shorts.length > 1 ? shorts[0].split("/").slice(0, -1) : [];
  for (const sh of shorts) {
    const parts = sh.split("/");
    let i = 0;
    while (i < common.length && i < parts.length - 1 && parts[i] === common[i]) i++;
    common = common.slice(0, i);
  }
  s.modules.forEach((m, i) => { m.n = shorts[i].split("/").slice(common.length).join("/"); });
  s.lines = s.modules.reduce((a, m) => a + (m.lang === "rs" ? (m.l || 0) : 0), 0);
  s.wgsl = s.modules.reduce((a, m) => a + (m.lang === "wgsl" ? (m.l || 0) : 0), 0);
  s.warnings = HEALTH.warnings.filter(w => w.nodes.includes(s.id)).length;
}
const maxLines = Math.max(...SUBS.map(s => s.lines));
const driftCount = NOTES.length + HEALTH.errors.length + HEALTH.warnings.length;

const STATUS = {
  settled: { label: "Settled", desc: "Shape agreed and built. Changes are additions." },
  interim: { label: "Interim", desc: "Works, with a recorded gap between code and target." },
  active: { label: "In progress", desc: "Being built or reshaped in the current version." },
};

const state = { zoom: "subsystems", lens: null, step: 0, view: "home", sel: null, open: new Set(), hotEdge: -1 };
try { const z = localStorage.getItem("vx-map-zoom"); if (z) state.zoom = z; } catch (e) {}

const map = document.getElementById("map");
const panel = document.getElementById("panel");
const fmtNum = n => n.toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const cube = mat => `<svg class="cube" viewBox="0 0 24 24" aria-hidden="true" style="--m: var(--${mat})"><path class="t" d="M12 2 22 7.5 12 13 2 7.5Z"/><path class="l" d="M2 7.5 12 13v10L2 17.5Z"/><path class="r" d="M22 7.5 12 13v10l10-5.5Z"/></svg>`;
const glyph = st => `<i class="st st-${st}" title="${STATUS[st].label}"></i>`;
const modSize = m => m.l == null ? "" : fmtNum(m.l) + (m.lang === "wgsl" ? " wgsl" : "");

function buildChrome() {
  document.getElementById("meta-line").innerHTML =
    `Branch <span class="mono">${esc(META.branch)}</span> · extracted at <span class="mono">${esc(META.commit)}</span>${META.dirty ? " with uncommitted changes" : ""} · ${esc(META.date)}`;
  document.getElementById("lens-seg").innerHTML =
    `<input type="radio" name="lens" id="l-off" value="" checked><label for="l-off">Off</label>` +
    Object.entries(LENSES).map(([k, L]) => `<input type="radio" name="lens" id="l-${k}" value="${k}"><label for="l-${k}">${esc(L.name)}</label>`).join("");
  document.getElementById("notes-count").textContent = driftCount;
}

function buildMap() {
  let html = `<svg class="edges" id="edges" aria-hidden="true"><defs>
    <marker id="m-out" class="m-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z"/></marker>
    <marker id="m-in" class="m-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z"/></marker>
  </defs><g id="edge-g"></g></svg>`;
  for (const r of REGIONS) {
    const subs = SUBS.filter(s => s.region === r.id);
    const lines = subs.reduce((a, s) => a + s.lines, 0);
    html += `<section class="band" data-region="${r.id}" style="--m: var(--${r.mat})">
      <button class="band-head" data-act="region" data-id="${r.id}">
        <span class="rtitle">${cube(r.mat)}<span class="rname">${esc(r.name)}</span></span>
        <span class="rmat">${r.mat}</span>
        <span class="rblurb">${fmt(r.blurb)}</span>
        <span class="rstats">${subs.length} subsystems${lines ? " · " + fmtNum(lines) + " lines" : ""}</span>
      </button>
      <div class="cards">`;
    for (const s of subs) {
      const pct = s.lines ? Math.max(3, Math.round(s.lines / maxLines * 100)) : 0;
      const locLabel = s.lines ? `${fmtNum(s.lines)} lines` : `${s.modules.length} files`;
      html += `<div class="card" data-id="${s.id}">
        <button class="card-main" data-act="sub" data-id="${s.id}" aria-label="${esc(s.name)}, ${STATUS[s.status].label}">
          <span class="card-title">${glyph(s.status)}<span class="nm">${esc(s.name)}</span>${s.warnings ? `<span class="warn" title="${s.warnings} extraction warnings">${s.warnings}</span>` : ""}<span class="steps"></span></span>
          <span class="crate">${esc(s.crate)}</span>
          <span class="sum">${fmt(s.short)}</span>
          <span class="loc"><span class="bar"><i style="width:${pct}%"></i></span><span class="num">${locLabel}</span></span>
        </button>
        <button class="mods-toggle" data-act="toggle" data-id="${s.id}" aria-expanded="false">Modules · ${s.modules.length}</button>
        <ul class="mods">${s.modules.map((m, i) => `<li><button data-act="mod" data-id="${s.id}" data-i="${i}"><span class="mn">${esc(m.n)}</span><span class="ml">${modSize(m)}</span></button></li>`).join("")}</ul>
      </div>`;
    }
    html += `</div></section>`;
  }
  map.innerHTML = html;
}

function lensNodesFor(lensKey) {
  const out = {};
  LENSES[lensKey].steps.forEach((st, i) => st.nodes.forEach(n => { (out[n] = out[n] || []).push(i); }));
  return out;
}
function connectedTo(id) {
  const ids = new Set();
  EDGES.forEach(e => { if (e.from === id) ids.add(e.to); if (e.to === id) ids.add(e.from); });
  return ids;
}

function apply() {
  map.className = "map z-" + state.zoom;
  document.getElementById("z-" + state.zoom).checked = true;
  document.getElementById(state.lens ? "l-" + state.lens : "l-off").checked = true;
  document.getElementById("notes-btn").setAttribute("aria-pressed", state.view === "notes" ? "true" : "false");

  const selSub = state.sel && (state.sel.kind === "sub" || state.sel.kind === "mod") ? state.sel.id : null;
  const linked = selSub && state.view === "detail" ? connectedTo(selSub) : new Set();
  const lensMap = state.lens ? lensNodesFor(state.lens) : {};
  const cur = state.lens ? LENSES[state.lens].steps[state.step] : null;
  const curNodes = new Set(cur && state.view === "lens" ? cur.nodes : []);
  const driftNodes = new Set(state.view === "notes" ? [...NOTES, ...HEALTH.errors, ...HEALTH.warnings].flatMap(n => n.nodes) : []);

  if (state.view === "detail" && selSub) map.classList.add("focus");
  if ((state.lens && state.view === "lens") || state.view === "notes") map.classList.add("lensing");

  map.querySelectorAll(".card").forEach(card => {
    const id = card.dataset.id;
    card.classList.toggle("sel", id === selSub && state.view === "detail");
    card.classList.toggle("linked", linked.has(id));
    card.classList.toggle("now", curNodes.has(id));
    card.classList.toggle("inlens", (!!lensMap[id] && state.view === "lens") || driftNodes.has(id));
    card.classList.toggle("open", state.open.has(id));
    card.querySelector(".mods-toggle").setAttribute("aria-expanded", state.open.has(id) ? "true" : "false");
    const steps = card.querySelector(".steps");
    steps.innerHTML = state.lens && lensMap[id]
      ? lensMap[id].map(i => `<span class="${i === state.step ? "now" : ""}">${i + 1}</span>`).join("") : "";
    card.querySelectorAll(".mods button").forEach(b => {
      b.classList.toggle("sel", !!state.sel && state.sel.kind === "mod" && state.sel.id === id && +b.dataset.i === state.sel.i);
    });
  });
  map.querySelectorAll(".band-head").forEach(h => h.classList.toggle("sel", !!state.sel && state.sel.kind === "region" && state.sel.id === h.dataset.id && state.view === "detail"));

  renderPanel();
  requestAnimationFrame(drawEdges);
  writeHash();
}

/* ---------- Edges ---------- */
function rectOf(id) {
  const el = map.querySelector(`.card[data-id="${id}"]`);
  if (!el) return null;
  const m = map.getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x: r.left - m.left, y: r.top - m.top, w: r.width, h: r.height };
}

/* Route from card a to card b. Cards in the same row always connect with an arc
   over the top: a straight line would run behind any card between them and end
   in the 10px gap, where the arrowhead cannot be seen. Stacked cards closer than
   CLOSE arc around the right side for the same reason. */
function pathBetween(a, b, k, n) {
  const CLOSE = 44, BULGE = 34;
  const spread = (k - (n - 1) / 2) * 7;
  const stacked = b.y >= a.y + a.h - 4 || a.y >= b.y + b.h - 4;
  if (stacked) {
    const down = b.y > a.y;
    const gap = down ? b.y - (a.y + a.h) : a.y - (b.y + b.h);
    const overlapX = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
    if (gap < CLOSE && overlapX > 0) {
      const x1 = a.x + a.w, y1 = a.y + a.h * (down ? 0.7 : 0.3) + spread;
      const x2 = b.x + b.w, y2 = b.y + b.h * (down ? 0.3 : 0.7) + spread;
      const xc = Math.max(x1, x2) + BULGE;
      return `M${x1} ${y1} C${xc} ${y1} ${xc} ${y2} ${x2} ${y2}`;
    }
    const x1 = a.x + a.w / 2 + spread, y1 = down ? a.y + a.h : a.y;
    const x2 = b.x + b.w / 2 + spread, y2 = down ? b.y : b.y + b.h;
    const c = Math.max(30, Math.abs(y2 - y1) / 2) * (down ? 1 : -1);
    return `M${x1} ${y1} C${x1} ${y1 + c} ${x2} ${y2 - c} ${x2} ${y2}`;
  }
  const right = b.x > a.x;
  const x1 = a.x + a.w * (right ? 0.7 : 0.3) + spread, y1 = a.y;
  const x2 = b.x + b.w * (right ? 0.3 : 0.7) + spread, y2 = b.y;
  const rise = Math.min(70, Math.max(BULGE, Math.abs(x2 - x1) * 0.15));
  const yc = Math.min(y1, y2) - rise;
  return `M${x1} ${y1} C${x1} ${yc} ${x2} ${yc} ${x2} ${y2}`;
}

function drawEdges() {
  const g = document.getElementById("edge-g");
  if (!g) return;
  const svg = document.getElementById("edges");
  svg.setAttribute("width", map.scrollWidth); svg.setAttribute("height", map.scrollHeight);
  let out = "";
  if (state.view === "detail" && state.sel && (state.sel.kind === "sub" || state.sel.kind === "mod")) {
    const id = state.sel.id;
    const list = EDGES.map((e, i) => ({ e, i })).filter(x => x.e.from === id || x.e.to === id);
    list.forEach((x, k) => {
      const a = rectOf(x.e.from), b = rectOf(x.e.to);
      if (!a || !b) return;
      const isOut = x.e.from === id;
      out += `<path class="e ${isOut ? "out" : "in"}${state.hotEdge === x.i ? " hot" : ""}" d="${pathBetween(a, b, k, list.length)}" marker-end="url(#${isOut ? "m-out" : "m-in"})"/>`;
    });
  } else if (state.view === "lens" && state.lens) {
    const steps = LENSES[state.lens].steps;
    const cur = steps[state.step], prev = steps[state.step - 1];
    if (prev && prev.nodes[0] !== cur.nodes[0]) {
      const a = rectOf(prev.nodes[0]), b = rectOf(cur.nodes[0]);
      if (a && b) out += `<path class="e lens" d="${pathBetween(a, b, 0, 1)}" marker-end="url(#m-out)"/>`;
    }
  }
  g.innerHTML = out;
}

/* ---------- Panel ---------- */
function linkBtn(id, arrow, what, edgeIdx, dir) {
  const s = subById[id];
  return `<li><button class="lnk" data-act="sub" data-id="${id}" ${edgeIdx != null ? `data-edge="${edgeIdx}"` : ""}>
    <span class="arr ${dir || ""}">${arrow}</span><span class="who">${esc(s.name)}</span>${what ? `<span class="what">${fmt(what)}</span>` : ""}</button></li>`;
}
function subLinks(ids) {
  return ids.map(id => subById[id] ? `<button class="textbtn" data-act="sub" data-id="${id}">${esc(subById[id].name)}</button>` : "").join(" · ");
}
function backToLens() {
  if (!state.lens) return "";
  return `<div class="backbar"><button class="textbtn" data-act="tolens">← Back to ${esc(LENSES[state.lens].name)}, step ${state.step + 1}</button></div>`;
}
function foot() {
  return `<p class="foot">Extracted from <span class="mono">${esc(META.commit)}</span> on <span class="mono">${esc(META.branch)}</span>. Module descriptions come from each file's <code>//!</code> doc, or from a note in <code>map.authored.json</code> where a file has none. Everything else is authored in that file; run <code>extract.py</code> after editing it.</p>`;
}

function renderHome() {
  const legend = Object.entries(STATUS).map(([k, v]) => `${glyph(k)}<span><b>${v.label}.</b> ${v.desc}</span>`).join("");
  return `<div class="eyebrow">Start here</div>
  <h2>How to read this map</h2>
  <p>Each band is a <b>region</b> of the engine, ordered roughly the way data flows: authored content at the top, pixels and play at the bottom. Each card inside is a <b>subsystem</b>, and its modules are the files that implement it.</p>
  <p>Use <b>Zoom</b> to change how much each card shows. Select a card to see what it owns, when it runs, the rules it keeps, and what it connects to; lines appear on the map for those connections. Select a region name for an overview of that region.</p>
  <p>A <b>lens</b> follows one process across the map step by step. Use the arrow keys or the buttons to move through it.</p>
  <h3>Engine at a glance</h3>
  <div class="stats">
    <div class="stat"><b>${fmtNum(META.rust)}</b><span>lines of Rust</span></div>
    <div class="stat"><b>${fmtNum(META.wgsl)}</b><span>lines of WGSL</span></div>
    <div class="stat"><b>${SUBS.length}</b><span>subsystems in ${META.crates} crates</span></div>
  </div>
  <h3>Status</h3>
  <div class="legend">${legend}</div>
  <h3>Threads, in lens steps</h3>
  <div class="legend"><span class="chip main">Main thread</span><span>Runs inside the frame schedule. Every millisecond here is frame time.</span><span class="chip">Worker</span><span>Runs on the job pool, off the frame.</span></div>
  <h3>Lines on the map</h3>
  <div class="legend"><svg width="34" height="10" aria-hidden="true"><path d="M1 5h28" stroke="var(--accent)" stroke-width="1.6"/><path d="M26 1l7 4-7 4z" fill="var(--accent)"/></svg><span>The selected part feeds this one.</span><svg width="34" height="10" aria-hidden="true"><path d="M1 5h28" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M26 1l7 4-7 4z" fill="var(--muted)"/></svg><span>This one feeds the selected part.</span><span class="warn">2</span><span>Extraction warnings on that part. Open Drift and checks to read them.</span></div>
  ${foot()}`;
}

function renderSub(id) {
  const s = subById[id], r = regById[s.region];
  const outs = EDGES.map((e, i) => ({ e, i })).filter(x => x.e.from === id);
  const ins = EDGES.map((e, i) => ({ e, i })).filter(x => x.e.to === id);
  const inLens = state.lens ? (lensNodesFor(state.lens)[id] || []) : [];
  const notes = NOTES.filter(n => n.nodes.includes(id));
  const warns = [...HEALTH.errors, ...HEALTH.warnings].filter(w => w.nodes.includes(id));
  const uses = COUPLINGS.filter(c => c.user === id);
  const usedBy = COUPLINGS.filter(c => c.used === id);
  const coup = (list, key) => list.map(c => `<li class="coupling"><button class="textbtn" data-act="sub" data-id="${c[key]}">${esc(subById[c[key]].name)}</button> · ${c.refs} refs${c.described ? "" : ` <span class="no">· no connection described</span>`}</li>`).join("");
  return `${backToLens()}
  <div class="eyebrow">${cube(r.mat)}<button class="textbtn" data-act="region" data-id="${r.id}">${esc(r.name)}</button></div>
  <h2>${esc(s.name)}</h2>
  <div class="chips"><span class="pill">${glyph(s.status)}${STATUS[s.status].label}</span><span class="chip stage">${esc(s.crate)}</span></div>
  <p class="summary">${fmt(s.summary)}</p>
  ${s.statusNote ? `<p class="status-note">${fmt(s.statusNote)}</p>` : ""}
  <h3>Owns</h3><ul>${s.owns.map(o => `<li>${fmt(o)}</li>`).join("")}</ul>
  <h3>When and where it runs</h3><p>${fmt(s.runs)}</p>
  <h3>Rules it keeps</h3><ul>${s.rules.map(o => `<li>${fmt(o)}</li>`).join("")}</ul>
  ${outs.length ? `<h3>Feeds into</h3><ul class="links">${outs.map(x => linkBtn(x.e.to, "→", x.e.label, x.i)).join("")}</ul>` : ""}
  ${ins.length ? `<h3>Takes from</h3><ul class="links">${ins.map(x => linkBtn(x.e.from, "←", x.e.label, x.i, "in")).join("")}</ul>` : ""}
  ${uses.length || usedBy.length ? `<h3>In the code</h3><p class="src-tag">Counted from <code>use</code> statements and paths, so a connection that is only data passed through a channel or a resource does not show here.</p>
    ${uses.length ? `<p style="margin:6px 0 2px">Refers to</p><ul>${coup(uses, "used")}</ul>` : ""}
    ${usedBy.length ? `<p style="margin:6px 0 2px">Referred to by</p><ul>${coup(usedBy, "user")}</ul>` : ""}` : ""}
  ${inLens.length ? `<h3>In this lens</h3><p>${inLens.map(i => `<button class="textbtn" data-act="step" data-i="${i}">Step ${i + 1}: ${esc(LENSES[state.lens].steps[i].title)}</button>`).join("<br>")}</p>` : ""}
  ${notes.length || warns.length ? `<h3>Drift</h3><ul>${notes.map(n => `<li><button class="textbtn" data-act="notes">${esc(n.title)}</button></li>`).join("")}${warns.map(w => `<li>${fmt(w.text)}</li>`).join("")}</ul>` : ""}
  <h3>Modules</h3><ul class="paths">${s.modules.map((m, i) => `<li><button class="textbtn mono" data-act="mod" data-id="${id}" data-i="${i}">${esc(m.n)}</button><span>${modSize(m)}</span></li>`).join("")}</ul>
  <h3>Read more</h3><ul>${s.refs.map(x => `<li>${fmt(x)}</li>`).join("")}</ul>`;
}

function renderModule(id, i) {
  const s = subById[id], m = s.modules[i], r = regById[s.region];
  const share = m.l && s.lines && m.lang === "rs" ? Math.round(m.l / s.lines * 100) : null;
  const src = m.src === "doc" ? "From the file's <code>//!</code> doc." : m.src === "note" ? "From a module note in the map; the file has no <code>//!</code> doc." : "";
  return `${backToLens()}
  <div class="eyebrow">${cube(r.mat)}<button class="textbtn" data-act="sub" data-id="${id}">${esc(s.name)}</button></div>
  <h2 style="font-family: var(--f-mono); font-size: 18px; overflow-wrap: anywhere;">${esc(m.n)}</h2>
  ${m.d ? `<p>${fmt(m.d)}</p><p class="src-tag">${src}</p>` : `<p class="src-tag">No description: the file has no <code>//!</code> doc and the map has no note for it.</p>`}
  <dl class="kv">
    <dt>Path</dt><dd class="mono" style="overflow-wrap:anywhere">${esc(m.p)}</dd>
    ${m.l != null ? `<dt>Size</dt><dd>${fmtNum(m.l)} lines${m.lang === "wgsl" ? " of WGSL" : ""}${share != null ? ` · ${share}% of ${esc(s.name)}` : ""}</dd>` : ""}
  </dl>
  <h3>Other modules in ${esc(s.name)}</h3>
  <ul class="paths">${s.modules.map((mm, j) => j === i ? "" : `<li><button class="textbtn mono" data-act="mod" data-id="${id}" data-i="${j}">${esc(mm.n)}</button><span>${modSize(mm)}</span></li>`).join("")}</ul>`;
}

function renderRegion(id) {
  const r = regById[id];
  const subs = SUBS.filter(s => s.region === id);
  const agg = {};
  EDGES.forEach(e => {
    const a = subById[e.from].region, b = subById[e.to].region;
    if (a === id && b !== id) (agg["→" + b] = agg["→" + b] || []).push(e);
    if (b === id && a !== id) (agg["←" + a] = agg["←" + a] || []).push(e);
  });
  const block = dir => Object.entries(agg).filter(([k]) => k[0] === dir).map(([k, es]) => {
    const other = regById[k.slice(1)];
    return `<li><b>${esc(other.name)}</b><ul>${es.map(e => `<li>${esc(subById[e.from].name)} → ${esc(subById[e.to].name)}: ${fmt(e.label)}</li>`).join("")}</ul></li>`;
  }).join("");
  const outB = block("→"), inB = block("←");
  return `${backToLens()}
  <div class="eyebrow">${cube(r.mat)}Region · ${r.mat}</div>
  <h2>${esc(r.name)}</h2>
  <p class="summary">${fmt(r.blurb)}</p>
  <h3>Subsystems</h3><ul class="links">${subs.map(s => linkBtn(s.id, glyph(s.status), s.short)).join("")}</ul>
  ${outB ? `<h3>Feeds other regions</h3><ul>${outB}</ul>` : ""}
  ${inB ? `<h3>Takes from other regions</h3><ul>${inB}</ul>` : ""}`;
}

function renderLens() {
  const L = LENSES[state.lens], st = L.steps[state.step], n = L.steps.length;
  const where = st.code.map(c => {
    const [file, sym] = c.ref.split(" · ");
    return `<li><span class="wf">${esc(file)}</span>${sym ? `<span class="ws">${esc(sym)}</span>` : ""}${c.ok ? "" : `<span class="miss">Not found at the last extraction</span>`}</li>`;
  }).join("");
  return `<div class="eyebrow">Lens</div>
  <h2>${esc(L.name)}</h2>
  <p>${fmt(L.blurb)}</p>
  <div class="stepper">
    <button data-act="prev" ${state.step === 0 ? "disabled" : ""}>‹ Prev</button>
    <span class="pos">Step ${state.step + 1} of ${n}</span>
    <button data-act="next" ${state.step === n - 1 ? "disabled" : ""}>Next ›</button>
  </div>
  <div class="stepbox">
    <h4>${esc(st.title)}</h4>
    <div class="chips"><span class="chip ${st.where === "main" ? "main" : ""}">${st.where === "main" ? "Main thread" : "Worker"}</span><span class="chip stage">${esc(st.stage)}</span></div>
    <p>${fmt(st.text)}</p>
    <h3 style="margin-top:10px">Where to look</h3>
    <ul class="where">${where}</ul>
    <h3>Parts involved</h3>
    <ul class="links">${st.nodes.map(id => linkBtn(id, "·", subById[id].short)).join("")}</ul>
  </div>
  <h3>All steps</h3>
  <ol class="steplist">${L.steps.map((s, i) => `<li><button data-act="step" data-i="${i}" class="${i === state.step ? "cur" : ""}"><span class="n">${String(i + 1).padStart(2, "0")}</span><span>${esc(s.title)}</span><span class="w">${s.where === "main" ? "main" : "worker"}</span></button></li>`).join("")}</ol>`;
}

function renderNotes() {
  const list = items => items.length ? `<ul>${items.map(it => `<li>${fmt(it.text)}${it.nodes.length ? `<br>${subLinks(it.nodes)}` : ""}</li>`).join("")}</ul>` : `<p class="src-tag">None.</p>`;
  return `<div class="eyebrow">Drift</div>
  <h2>Drift and checks</h2>
  <p>Places where the code, its comments, the design doc and this map disagree. Affected parts are highlighted on the map.</p>
  <h3>Written notes</h3>
  ${NOTES.length ? NOTES.map(n => `<div class="note"><h4>${esc(n.title)}</h4><p>${fmt(n.text)}</p><p>${subLinks(n.nodes)}</p></div>`).join("") : `<p class="src-tag">None.</p>`}
  <h3>From the last extraction</h3>
  <div class="health">
    <h4>Errors (${HEALTH.errors.length})</h4>${list(HEALTH.errors)}
    <h4>Warnings (${HEALTH.warnings.length})</h4>${list(HEALTH.warnings)}
    <h4>Information (${HEALTH.info.length})</h4>${list(HEALTH.info)}
  </div>
  ${foot()}`;
}

function renderPanel() {
  let html;
  if (state.view === "lens" && state.lens) html = renderLens();
  else if (state.view === "notes") html = renderNotes();
  else if (state.view === "detail" && state.sel) {
    if (state.sel.kind === "sub") html = renderSub(state.sel.id);
    else if (state.sel.kind === "mod") html = renderModule(state.sel.id, state.sel.i);
    else html = renderRegion(state.sel.id);
  } else html = renderHome();
  panel.innerHTML = html;
}

/* ---------- Hash ---------- */
function writeHash() {
  let t = "";
  if (state.view === "lens" && state.lens) t = state.lens;
  else if (state.view === "notes") t = "drift";
  else if (state.view === "detail" && state.sel) t = state.sel.id;
  try { history.replaceState(null, "", t ? "#" + t : location.pathname + location.search); } catch (e) {}
}
function readHash() {
  const t = (location.hash || "").slice(1);
  if (!t) return;
  if (LENSES[t]) { state.lens = t; state.view = "lens"; state.step = 0; }
  else if (t === "drift") state.view = "notes";
  else if (subById[t]) { state.sel = { kind: "sub", id: t }; state.view = "detail"; }
  else if (regById[t]) { state.sel = { kind: "region", id: t }; state.view = "detail"; }
}

/* ---------- Events ---------- */
const narrow = window.matchMedia("(max-width: 959px)");
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
function revealPanel() {
  if (narrow.matches) panel.scrollIntoView({ behavior: reduced.matches ? "auto" : "smooth", block: "start" });
  else panel.scrollTop = 0;
}

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  state.hotEdge = -1;
  if (act === "sub") { state.sel = { kind: "sub", id: b.dataset.id }; state.view = "detail"; revealPanel(); }
  else if (act === "mod") { state.sel = { kind: "mod", id: b.dataset.id, i: +b.dataset.i }; state.view = "detail"; revealPanel(); }
  else if (act === "region") { state.sel = { kind: "region", id: b.dataset.id }; state.view = "detail"; revealPanel(); }
  else if (act === "toggle") { const id = b.dataset.id; state.open.has(id) ? state.open.delete(id) : state.open.add(id); }
  else if (act === "prev") state.step = Math.max(0, state.step - 1);
  else if (act === "next") state.step = Math.min(LENSES[state.lens].steps.length - 1, state.step + 1);
  else if (act === "step") { state.step = +b.dataset.i; state.view = "lens"; revealPanel(); }
  else if (act === "tolens") state.view = "lens";
  else if (act === "notes") { state.view = "notes"; revealPanel(); }
  apply();
});

document.getElementById("notes-btn").addEventListener("click", () => {
  state.view = state.view === "notes" ? (state.lens ? "lens" : "home") : "notes";
  apply();
});

document.addEventListener("change", ev => {
  const inp = ev.target;
  if (inp.name === "zoom") {
    state.zoom = inp.value;
    try { localStorage.setItem("vx-map-zoom", state.zoom); } catch (e) {}
    apply();
  } else if (inp.name === "lens") {
    state.lens = inp.value || null;
    state.step = 0;
    state.view = state.lens ? "lens" : (state.sel ? "detail" : "home");
    apply();
  }
});

panel.addEventListener("mouseover", ev => {
  const b = ev.target.closest("[data-edge]");
  const idx = b ? +b.dataset.edge : -1;
  if (idx !== state.hotEdge) { state.hotEdge = idx; drawEdges(); }
});
panel.addEventListener("mouseleave", () => { if (state.hotEdge !== -1) { state.hotEdge = -1; drawEdges(); } });

document.addEventListener("keydown", ev => {
  if (ev.target.matches("input, textarea")) return;
  if (state.view === "lens" && state.lens) {
    const n = LENSES[state.lens].steps.length;
    if (ev.key === "ArrowRight" && state.step < n - 1) { state.step++; apply(); ev.preventDefault(); }
    if (ev.key === "ArrowLeft" && state.step > 0) { state.step--; apply(); ev.preventDefault(); }
  }
  if (ev.key === "Escape" && state.view !== "home") { state.view = state.lens ? "lens" : "home"; state.sel = null; apply(); }
});

new ResizeObserver(() => requestAnimationFrame(drawEdges)).observe(map);

buildChrome();
buildMap();
readHash();
apply();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestAnimationFrame(drawEdges));
</script>
