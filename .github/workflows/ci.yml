name: CI

on:
  # No branch filter: under the §7.5 one-branch-per-version policy the branch
  # name changes every version, so naming them here guarantees the list goes
  # stale (it already had, pointing at the deleted mc-revision).
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # windows-latest: this is a Windows-primary project, and the tests and
    # checks here do not depend on the platform. Linux and macOS are built and
    # compared by the determinism job below (T7). Linux builds there still need
    # the windowing and GPU packages, until the headless server (R3c) gives the
    # job a binary without them; the server-core job below already builds
    # without them.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # The toolchain rust-toolchain.toml pins, so CI builds with the compiler
      # the benchmark baseline was measured on.
      - name: Install toolchain
        run: rustup toolchain install

      # rusqlite (bundled) and zstd compile C, so the cache is worth a lot here.
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      # Engine/game boundary (roadmap §7.2): consumers depend on the
      # `voxulacrum` facade only. Server rule (design §12, "Crates and
      # sides"): no server crate reaches a renderer, windowing or UI crate
      # through normal or build dependencies on any target.
      - name: Boundary check
        run: cargo run -p boundary-check

      # Tier-1 math (design §12, "Determinism"; R7): generation, the mutation
      # door's handlers and fluids call no platform math library, no fused
      # multiply-add and no SIMD-backed glam type. The lists are in each crate's
      # clippy.toml; server-core's mirrors nodegraph-eval's, and its Tier-2
      # player step opts out. Only those two lints are denied here; the crates'
      # other clippy warnings are not.
      - name: Tier-1 math
        run: cargo clippy -p nodegraph-eval -p voxulacrum-server-core --all-targets -- -D clippy::disallowed_methods -D clippy::disallowed_types

      # Docs (F8, #87): any rustdoc warning, such as a broken intra-doc link or
      # a public doc linking a private item, fails the build. RUSTDOCFLAGS is set
      # on this step only: cargo test passes it to doctests as well, and their
      # warnings are not what this gate is for.
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      # Determinism coverage lives here: the slab-bearing generation test and the
      # scatter seed-derivation tests added in Phase 10 Substep 4, plus every
      # other workspace test.
      - name: Test
        run: cargo test --workspace

      # Code derives tick counts from TICK_RATE_HZ and never assumes 30
      # (engine-design.md §12, "Time"), so the tests run again at 20 Hz. The
      # variable changes a constant, so this rebuilds the server-core crate and
      # what depends on it.
      - name: Test at 20 Hz
        env:
          VOXULACRUM_TICK_RATE_HZ: "20"
        run: cargo test --workspace

      # Content validation: manifest resolution, graph kinds, reference targets,
      # and assignment coverage. Errors fail; warnings report. `--strict` is
      # deliberately not used yet - `biome_test` is registered and unassigned,
      # which is a true finding about shipped content that Substep 11 resolves.
      - name: Validate graphs
        run: cargo run -p voxulacrum-app --bin voxulacrum-app -- --validate-graphs

      - name: Verify generation determinism
        run: cargo run -p voxulacrum-app --bin voxulacrum-app -- --verify-generation 512

  # Server-core on its own (design §12, "Crates and sides"): a bare Linux runner
  # with only the Rust toolchain, no windowing or GPU packages. boundary-check
  # proves the dependency graph is clean; this proves the crate builds and its
  # tests pass without them. Building the one package also catches a feature
  # it uses but only gets through another workspace crate's unification.
  server-core:
    name: Server core (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: server-core-linux

      - name: Build
        run: cargo build --locked -p voxulacrum-server-core

      - name: Test
        run: cargo test -p voxulacrum-server-core

  # Cross-platform determinism (roadmap §4.5, T7; design §12 "Determinism
  # tiers"). Each runner writes a manifest of its Tier-1 hashes: 512 generated
  # chunks layer by layer, a fluid pour and a run of edits. The compare job
  # below diffs them. Writing a manifest also fails when its sample holds no
  # chunk of a kind it must cover, or a scenario did not exercise what it is for.
  determinism:
    name: Determinism (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    # macOS (aarch64) reports but never fails the build: it is not a supported
    # host yet, and SIMD math may differ there in ways x86_64 runners share.
    continue-on-error: ${{ matrix.informative }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            informative: false
          - os: ubuntu-latest
            label: linux-x64
            informative: false
          - os: macos-14
            label: macos-arm64
            informative: true

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: determinism-${{ matrix.label }}

      # The manifest is written by the app binary, so Linux needs what
      # release.yml installs for it. R3c moves the harness to the headless
      # server, which needs none of this.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libvulkan-dev

      - name: Write the determinism manifest
        run: cargo run -p voxulacrum-app --bin voxulacrum-app -- --determinism-manifest determinism-${{ matrix.label }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.label }}
          path: determinism-${{ matrix.label }}.json
          if-no-files-found: error

  determinism-compare:
    name: Determinism compare
    needs: determinism
    # Runs even when a runner failed, so the manifests that were written are
    # still compared. A runner's own failure already fails the build.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: determinism-compare

      - name: Build determinism-diff
        run: cargo build -p determinism-diff

      - uses: actions/download-artifact@v4
        with:
          pattern: determinism-*
          path: manifests
          merge-multiple: true

      # The gate: Tier 1 must be bit-identical on every machine. Generation
      # still calls the platform's powf, ln, sin and cos for tree skeletons
      # until R7 (#95) moves them to libm, so a runner image update could fail
      # this before then. That would be the defect R7 removes, not a flaky check.
      - name: Windows against Linux
        shell: bash
        run: |
          echo '### Windows against Linux' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          status=0
          cargo run -q -p determinism-diff -- manifests/determinism-windows-x64.json manifests/determinism-linux-x64.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Windows against macOS (informative)
        continue-on-error: true
        shell: bash
        run: |
          echo '### Windows against macOS (informative)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          status=0
          cargo run -q -p determinism-diff -- manifests/determinism-windows-x64.json manifests/determinism-macos-arm64.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status